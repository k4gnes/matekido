<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .poly { stroke: #FFFFFF; stroke-width: 4.5; stroke-linejoin: round; stroke-linecap: round; }
    </style>
    <linearGradient id="bluePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F86F7" />
      <stop offset="100%" stop-color="#3A71E0" />
    </linearGradient>
    <linearGradient id="blueDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A71E0" />
      <stop offset="100%" stop-color="#285BC7" />
    </linearGradient>
    <linearGradient id="blueLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DA5FC" />
      <stop offset="100%" stop-color="#4F86F7" />
    </linearGradient>
    <linearGradient id="grayLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E9ED" />
      <stop offset="100%" stop-color="#D0D6DC" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bluePrimary)"/>

  <g transform="translate(256,256) scale(0.8) translate(-256,-296)">
    <polygon points="96,256 176,176 176,256" fill="url(#bluePrimary)" class="poly" />
    <polygon points="96,256 176,256 96,336" fill="url(#grayLight)" class="poly" />
    <polygon points="96,336 176,256 176,336" fill="url(#bluePrimary)" class="poly" />
    <polygon points="96,336 176,336 96,416" fill="url(#blueDark)" class="poly" />
    <polygon points="96,416 176,336 176,416" fill="url(#grayLight)" class="poly" />

    <polygon points="176,176 336,176 256,256" fill="url(#grayLight)" class="poly" />
    <polygon points="176,176 256,256 176,256" fill="url(#blueDark)" class="poly" />
    <polygon points="176,256 256,256 336,256 256,336" fill="url(#bluePrimary)" class="poly" />
    <polygon points="336,176 336,256 256,256" fill="url(#blueLight)" class="poly" />

    <polygon points="336,176 416,256 336,256" fill="url(#blueLight)" class="poly" />
    <polygon points="336,256 416,256 336,336" fill="url(#bluePrimary)" class="poly" />
    <polygon points="416,256 336,336 416,336" fill="url(#blueDark)" class="poly" />
    <polygon points="336,336 416,336 336,416" fill="url(#blueDark)" class="poly" />
    <polygon points="336,416 416,336 416,416" fill="url(#grayLight)" class="poly" />
