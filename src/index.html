            <h1 style="margin-top:0;text-align:center;">☕ Matekidő</h1>
            <p style="font-size:1.1rem;line-height:1.6;text-align:left;">
                <strong>Az oldal használatához engedélyezned kell a JavaScriptet.</strong>
                Matekidő egy olyan interaktív matematikai tanulási platform, amely a böngésződben fut, ezért JavaScript nélkül sajnos nem tud működni.
                Kapcsold be a JavaScriptet a böngésződ beállításaiban, majd töltsd újra az oldalt.
            </p>
            <h2 style="margin-top:1.5rem;margin-bottom:.5rem;">Mit találsz itt? 🎓</h2>
            <p style="font-size:1rem;line-height:1.6;text-align:left;">
                Interaktív, játékos matematikafeladatok magyar gyerekeknek az első, második és harmadik osztályos tananyag szerint:
            </p>
            <ul style="font-size:1rem;line-height:1.6;text-align:left;padding-left:1.3rem;">
                <li><strong>1. osztály:</strong> számok bontása, kiegészítés, tízesátlépés, helyiérték, összeadás és kivonás 20-ig, összehasonlítás, számsorok, rendezés, páros-páratlan, sorminták, alakzatok, térbeli tájékozódás, idő (egész és fél óra), pénz, mérés, szöveges feladatok.</li>
                <li><strong>2. osztály:</strong> összeadás és kivonás 100-ig (kerek tízesekkel, átlépéssel), hiányzó számok, vegyes műveletek, szorzás és osztás (2, 3, 4, 5, 10-es tábla), szorzás és osztás kapcsolata, hiányzó tag és tényező, szöveges feladatok (összeadásos, szorzásos, osztásos, kétlépéses), becslés, igaz-hamis, hibás számolás keresése, alakzatok és térbeli alakzatok, idő (negyedóra), pénz és visszajáró, tömeg, űrtartalom, hosszúság.</li>
                <li><strong>3. osztály:</strong> helyiérték, számnevek, szomszédok és összehasonlítás 1000-ig, kerekítés, római számok, összeadás és kivonás 1000-ig (kerek százasokkal, átlépéssel), vegyes műveletek 1000-ig, szorzás és osztás a 6, 7, 8, 9-es táblával, hiányzó tényező, szorzás és osztás kapcsolata, vegyes szorzás és osztás.</li>
            </ul>
            <p style="font-size:1rem;line-height:1.6;text-align:left;">
                Az egyes feladatok vidám történetekbe ágyazva jelennek meg (versenypálya, konyha, focipálya, állatkert, űrállomás), és minden gyerek a saját tempójában haladhat, sosem büntetjük őt. Az elért eredményeket, pontszámokat és statisztikákat a profilodban követheted nyomon.
            </p>
